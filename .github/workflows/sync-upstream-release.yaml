name: Sync Upstream Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      workflows: write
      actions: write
      repository-projects: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote if not exists
        run: |
          git remote | grep '^upstream$' || git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
        env:
          UPSTREAM_REPO: "Predidit/Kazumi"

      - name: Sync via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: "Predidit/Kazumi"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LATEST_TAG=$(gh api repos/$UPSTREAM_REPO/releases/latest --jq '.tag_name')
          echo "Upstream Release: $LATEST_TAG"

          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            echo "Already up to date."
            exit 0
          fi

          git fetch upstream --tags

          SYNC_BRANCH="sync-upstream-$LATEST_TAG"
          # 删除本地同名分支（如果存在）
          if git show-ref --quiet refs/heads/"$SYNC_BRANCH"; then
            git branch -D "$SYNC_BRANCH"
          fi
          git checkout -b "$SYNC_BRANCH" main

          if git merge "$LATEST_TAG" --allow-unrelated-histories -m "Sync upstream release $LATEST_TAG"; then
            echo "Merge complete."
          else
            echo "Merge failed, waiting for check."
            git add .
            git commit -m "chore: sync $LATEST_TAG with conflicts" || true
          fi

          git push -f origin "$SYNC_BRANCH"

          # 检查是否已存在同分支的PR
          if gh pr list --head "$SYNC_BRANCH" --repo starlit-dream/Kazumas | grep -q .; then
            echo "PR already exists for $SYNC_BRANCH"
          else
            gh pr create --repo starlit-dream/Kazumas \
                         --title "Sync upstream ver $LATEST_TAG" \
                         --body "zsbd" \
                         --base main \
                         --head "$SYNC_BRANCH"
          fi
